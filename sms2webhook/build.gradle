plugins {
    id 'com.android.application'
}

// Release signing is supplied by CI through these Gradle properties, or by
// environment variables of the same name. They are deliberately absent from the
// checked-in gradle.properties so no machine-specific path is committed.
// When they are not supplied (local builds, pull request builds) the release
// build type falls back to debug signing.
def signingInput = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name))
}

def releaseStoreFile = signingInput('RELEASE_STORE_FILE')
def releaseStorePassword = signingInput('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingInput('RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingInput('RELEASE_KEY_PASSWORD').orElse(releaseStorePassword)

def suppliedSigningInputs = [releaseStoreFile, releaseStorePassword, releaseKeyAlias]
        .findAll { it.isPresent() }
def hasReleaseSigning = suppliedSigningInputs.size() == 3

if (!suppliedSigningInputs.isEmpty() && !hasReleaseSigning) {
    throw new GradleException(
            'Incomplete release signing configuration. RELEASE_STORE_FILE, ' +
            'RELEASE_STORE_PASSWORD and RELEASE_KEY_ALIAS must all be set, via ' +
            'Gradle properties or environment variables. RELEASE_KEY_PASSWORD is ' +
            'optional and defaults to RELEASE_STORE_PASSWORD.')
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "org.golder.sms2webhook"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "2.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile.get())
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
                // Explicit, because the JDK default (pkcs12 on 21) rejects a legacy
                // JKS keystore with "Tag number over 30 is not supported".
                storeType = 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError = false
    }
    namespace = 'org.golder.sms2webhook'

}

if (!hasReleaseSigning) {
    logger.info('Release signing credentials not supplied; release builds will be signed with the debug key.')
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.room:room-common:2.8.5'
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'

    // Added for MVVM architecture
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    
    // Added for RecyclerView and SwipeRefreshLayout
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    // QR scanning for the server-issued setup code. ZXing is used rather than
    // ML Kit deliberately: ML Kit's bundled scanner needs Google Play Services,
    // which a self-hosted family app has no reason to depend on.
    //
    // zxing-android-embedded provides the capture UI. ScanContract defaults to the
    // library's own embedded CaptureActivity, which is what SettingsFragment
    // relies on - the bare ACTION_SCAN intent form would instead redirect to a
    // Play Store install when no scanner app is present.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.json:json:20260814'

    // Instrumented testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}