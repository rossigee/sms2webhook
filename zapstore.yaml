release_notes: ./CHANGELOG.md

# The relay fetches this file to whitelist the publisher, and requires pubkey to
# match the key that signs the release events.
#
# It does not have to be filled in by hand: the action derives the npub from the
# ZAPSTORE_SIGN_WITH credential at publish time and writes it here. The exception
# is a NIP-46 bunker credential, whose identity is only known after connecting,
# which must be pasted in manually.
pubkey: npub1u0rdn4g56a90us8lhwf7vkwtxngun29ar6z0vra2u3f94fs5y0ysezjz7e
