name: Android CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Get commit info
        id: commit
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-debug-${{ steps.commit.outputs.COMMIT_SHORT }}.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-release-${{ steps.commit.outputs.COMMIT_SHORT }}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: sms2webhook-debug-${{ steps.commit.outputs.BRANCH_NAME }}-${{ steps.commit.outputs.COMMIT_SHORT }}
          path: app/build/outputs/apk/debug/sms2webhook-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: sms2webhook-release-${{ steps.commit.outputs.BRANCH_NAME }}-${{ steps.commit.outputs.COMMIT_SHORT }}
          path: app/build/outputs/apk/release/sms2webhook-*.apk

      - name: Create build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.commit.outputs.BRANCH_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.commit.outputs.COMMIT_SHORT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ steps.commit.outputs.COMMIT_MESSAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APKs Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-debug-${{ steps.commit.outputs.COMMIT_SHORT }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-release-${{ steps.commit.outputs.COMMIT_SHORT }}.apk" >> $GITHUB_STEP_SUMMARY