name: Android CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

env:
  MODULE: sms2webhook

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Summarise lint results
        if: always()
        uses: ./.github/actions/summarise-lint
        with:
          report-path: ${{ env.MODULE }}/build/reports/lint-results-debug.xml

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: ${{ env.MODULE }}/build/reports/lint-results-*.html
          if-no-files-found: warn

  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' "$MODULE/build.gradle")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Get commit info
        id: commit
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          BRANCH_NAME="${HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          BRANCH_NAME="${BRANCH_NAME//\//-}"
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          mv "$MODULE/build/outputs/apk/debug/sms2webhook-debug.apk" \
             "sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-debug-${{ steps.commit.outputs.COMMIT_SHORT }}.apk"
          mv "$MODULE/build/outputs/apk/release/sms2webhook-release.apk" \
             "sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-release-${{ steps.commit.outputs.COMMIT_SHORT }}.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sms2webhook-debug-${{ steps.commit.outputs.BRANCH_NAME }}-${{ steps.commit.outputs.COMMIT_SHORT }}
          path: sms2webhook-*-debug-*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: sms2webhook-release-${{ steps.commit.outputs.BRANCH_NAME }}-${{ steps.commit.outputs.COMMIT_SHORT }}
          path: sms2webhook-*-release-*.apk
          if-no-files-found: error

      - name: Create build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.commit.outputs.BRANCH_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.commit.outputs.COMMIT_SHORT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ steps.commit.outputs.COMMIT_MESSAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APKs Generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-debug-${{ steps.commit.outputs.COMMIT_SHORT }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: sms2webhook-${{ steps.version.outputs.VERSION_NAME }}-release-${{ steps.commit.outputs.COMMIT_SHORT }}.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release APK is signed with the debug key. Tagged releases are signed with the release key." >> $GITHUB_STEP_SUMMARY
