name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version info
        id: version
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk sms2webhook-${{ steps.version.outputs.VERSION_TAG }}-debug.apk
          if [ -f "${{ steps.sign_apk.outputs.signedReleaseFile }}" ]; then
            mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" sms2webhook-${{ steps.version.outputs.VERSION_TAG }}-release-signed.apk
          else
            mv app/build/outputs/apk/release/app-release.apk sms2webhook-${{ steps.version.outputs.VERSION_TAG }}-release-unsigned.apk
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.VERSION_TAG }}^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          else
            # Generate changelog between tags
            CHANGELOG=$(git log $PREV_TAG..${{ steps.version.outputs.VERSION_TAG }} --pretty=format:"- %s" --no-merges | head -20)
            
            # Escape multiline string for GitHub Actions
            CHANGELOG="${CHANGELOG//'%'/'%25'}"
            CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
            CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
            
            echo "CHANGELOG=$CHANGELOG" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION_TAG }}
          name: Release ${{ steps.version.outputs.VERSION_TAG }}
          body: |
            ## SMS2Webhook Release ${{ steps.version.outputs.VERSION_TAG }}
            
            ### What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### Downloads
            - **Debug APK**: For testing purposes (includes debugging symbols)
            - **Release APK**: Optimized production build
            
            ### Installation
            1. Download the APK file suitable for your needs
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the downloaded APK file to install
            
            ### Requirements
            - Android 13+ (API level 34)
            - Permissions: SMS reading and Internet access
          files: |
            sms2webhook-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true