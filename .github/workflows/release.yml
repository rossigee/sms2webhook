name: Release

on:
  push:
    tags:
      - 'v*'

env:
  MODULE: sms2webhook

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release-keystore.p12"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"
          # -storetype PKCS12 must match what Gradle reads the keystore with, or a
          # legacy JKS file passes this check and then fails during assembleRelease.
          keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE" -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS"
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' "$MODULE/build.gradle")
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed release APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(printf '%s\n' "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs \
            "$MODULE/build/outputs/apk/release/sms2webhook-release.apk"

      - name: Remove signing keystore
        if: ${{ always() && !cancelled() }}
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"

      - name: Rename APKs
        run: |
          mv "$MODULE/build/outputs/apk/debug/sms2webhook-debug.apk" \
             "sms2webhook-${{ steps.version.outputs.VERSION_TAG }}-debug.apk"
          mv "$MODULE/build/outputs/apk/release/sms2webhook-release.apk" \
             "sms2webhook-${{ steps.version.outputs.VERSION_TAG }}-release-signed.apk"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.VERSION_TAG }}^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
          else
            # Generate changelog between tags
            CHANGELOG=$(git log $PREV_TAG..${{ steps.version.outputs.VERSION_TAG }} --pretty=format:"- %s" --no-merges | head -20)

            # Escape multiline string for GitHub Actions
            CHANGELOG="${CHANGELOG//'%'/'%25'}"
            CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
            CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

            echo "CHANGELOG=$CHANGELOG" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION_TAG }}
          name: Release ${{ steps.version.outputs.VERSION_TAG }}
          body: |
            ## SMS2Webhook Release ${{ steps.version.outputs.VERSION_TAG }}

            ### What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Downloads
            - **Debug APK**: For testing purposes (includes debugging symbols)
            - **Release APK**: Optimized production build, signed with the release key

            ### Installation
            1. Download the APK file suitable for your needs
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the downloaded APK file to install

            ### Requirements
            - Android 9.0+ (API level 28)
            - Permissions: SMS reading and internet access
          files: |
            sms2webhook-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true

      # Runs last: the action fetches the APK from the release asset created
      # above, so this cannot run before the Create Release step.
      #
      # The credential is passed through the environment rather than `with:` so
      # it never appears in the workflow file, and the action masks it with
      # ::add-mask:: as soon as it reads it.
      #
      # skip-if-unconfigured keeps the release green before a Zapstore identity
      # exists. Remove it once publishing is expected on every tag.
      - name: Publish to Zapstore
        uses: rossigee/zapstore-publish@main
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: zapstore.yaml
          skip-if-unconfigured: 'true'
