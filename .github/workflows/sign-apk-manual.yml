name: Manual APK Signing

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  sign:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Get version
        id: version
        run: echo "VERSION_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      
      - name: Decode and prepare keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
          
          # Try to convert to PKCS12 format if needed
          keytool -importkeystore \
            -srckeystore keystore.jks \
            -srcstoretype JKS \
            -srcstorepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -destkeystore keystore.p12 \
            -deststoretype PKCS12 \
            -deststorepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -noprompt || true
          
          # Use PKCS12 if conversion succeeded, otherwise use original
          if [ -f keystore.p12 ]; then
            mv keystore.p12 keystore.jks
          fi
      
      - name: Sign APK manually
        run: |
          # Ensure apksigner uses compatible settings
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v4-signing-enabled false \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
      
      - name: Verify signed APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose \
            app/build/outputs/apk/release/app-release-signed.apk
      
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f keystore.jks keystore.p12
      
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release-signed.apk